name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --disable-interactivity
      - name: Build the installer
        shell: pwsh
        env:
          CAIRN_NOTES: ${{ github.event.head_commit.message }}
        run: ./packaging/build.ps1 -BuildNumber ${{ github.run_number }} -UpdateRepo "${{ github.repository }}" -Notes $env:CAIRN_NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cairn build ${{ github.run_number }}
          make_latest: true
          files: |
            packaging/out/CairnSetup.exe
            packaging/out/version.json
